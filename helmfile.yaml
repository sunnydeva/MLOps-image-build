helmDefaults:
  wait: true
  timeout: 800
  atomic: false

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: C:/Users/Admin/Documents/ML-OPS/kubernates/crds/charts/cert-manager-v1.14.4.tgz
    values:
      - installCRDs: true

  - name: istio-base
    namespace: istio-system
    createNamespace: true
    chart: C:/Users/Admin/Documents/ML-OPS/kubernates/crds/charts/base-1.21.0.tgz
    needs:
      - cert-manager/cert-manager
    atomic: false

  - name: istiod
    namespace: istio-system
    chart: C:/Users/Admin/Documents/ML-OPS/kubernates/crds/charts/istiod-1.21.0.tgz
    needs:
      - istio-system/istio-base

  - name: istio-ingressgateway
    namespace: istio-system
    chart: C:/Users/Admin/Documents/ML-OPS/kubernates/crds/charts/gateway-1.21.0.tgz
    needs:
      - istio-system/istiod
    atomic: false
    wait: false

